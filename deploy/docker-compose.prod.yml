# Produção do Atlas num host com Docker (ADR-058/059). Ver docs/DEPLOY.md.
#   cp deploy/.env.production.example deploy/.env  # e preencha
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: atlas

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]
    # Sem porta publicada: o banco só é acessível pela rede interna.

  migrate:
    image: atlas-api:${ATLAS_VERSION:-latest}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/release.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlas}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  api:
    <<: *restart
    image: atlas-api:${ATLAS_VERSION:-latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atlas}
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_ORIGIN: https://${DOMAIN:?defina DOMAIN}
      # Só o Caddy (rede interna fixa) é proxy confiável para X-Forwarded-For (ADR-014).
      TRUST_PROXY: 172.28.0.0/16
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-}
      AI_DAILY_TOKEN_LIMIT: ${AI_DAILY_TOKEN_LIMIT:-200000}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  web:
    <<: *restart
    image: atlas-web:${ATLAS_VERSION:-latest}
    build: { context: .., dockerfile: apps/web/Dockerfile }
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

  caddy:
    <<: *restart
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
    networks:
      internal: { ipv4_address: 172.28.0.10 }

  backup:
    <<: *restart
    image: atlas-backup:${ATLAS_VERSION:-latest}
    build: { context: ./backup }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-atlas}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-atlas}
      TZ: ${BACKUP_TZ:-America/Sao_Paulo}
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  backups:
  caddy-data:
  caddy-config:
