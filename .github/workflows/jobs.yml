# Rodada horária dos jobs em produção (ADR-064): TDEE adaptativo, insights, resumo semanal e
# limpezas. Chama POST /api/v1/internal/tick com o CRON_SECRET.
# Variável do repositório: ATLAS_URL (ex.: https://atlas.exemplo.com.br). Segredo: CRON_SECRET.
name: Jobs (rodada horária)

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: jobs-tick
  cancel-in-progress: false

jobs:
  tick:
    name: Rodada
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ATLAS_URL: ${{ vars.ATLAS_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Chama a rodada
        run: |
          if [ -z "$ATLAS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::ATLAS_URL ou CRON_SECRET não configurado; rodada ignorada."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 280 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${ATLAS_URL%/}/api/v1/internal/tick"
