name: CI

# Todo push (inclui main, exigido pelo PROMPT_MESTRE 13) e execução manual.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Integração usa Testcontainers (Docker do runner).
      - run: pnpm test
      - run: pnpm build
        env:
          NODE_ENV: production

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: 'true'
      DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas
      WEB_ORIGIN: http://localhost:3000
      API_URL: http://localhost:3001
      LOG_LEVEL: warn
      # API embutida no Next, como na Vercel (ADR-064); a stack Docker é testada no job Deploy.
      E2E_EMBEDDED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed:demo
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # LCP < 2,5 s no celular (4× CPU, Slow 4G) nas telas principais (Fase 8, ADR-062).
      - run: pnpm perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  deploy:
    name: Deploy (imagens, smoke e backup)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Env de teste (DOMAIN=localhost usa a CA interna do Caddy)
        run: |
          cat > "$RUNNER_TEMP/prod.env" <<'ENV'
          DOMAIN=localhost
          ACME_EMAIL=ci@example.com
          POSTGRES_PASSWORD=ci-secret'senha&x
          JOBS_ENABLED=true
          ENV
      - name: Build das imagens
        run: docker compose -f deploy/docker-compose.prod.yml --env-file "$RUNNER_TEMP/prod.env" build
      - name: Sobe a stack de produção
        run: docker compose -f deploy/docker-compose.prod.yml --env-file "$RUNNER_TEMP/prod.env" up -d
      - run: curl -fsSk --retry 15 --retry-delay 2 --retry-all-errors https://localhost/api/v1/health
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: Smoke contra a stack
        run: pnpm --filter @atlas/web smoke
        env:
          SMOKE_URL: https://localhost
      - name: Backup e restauração
        run: deploy/test-backup.sh --env-file "$RUNNER_TEMP/prod.env"
      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file "$RUNNER_TEMP/prod.env" logs --tail 200
      - name: Derruba
        if: always()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file "$RUNNER_TEMP/prod.env" down -v
